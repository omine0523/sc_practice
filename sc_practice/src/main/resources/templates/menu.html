<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>書籍管理システム</title>
	<!-- style -->
	<link rel="stylesheet" th:href="@{/css/sidebar.css}">
	<link rel="stylesheet" th:href="@{/css/menu.css}">
</head>

<body>
	<!-- 共通サイドバーの挿入。現在のページ識別子として 'menu' を渡す -->
	<div th:replace="~{common/sidebar :: layout-sidebar('menu')}"></div>

	<!-- メインコンテンツエリア -->
	<main class="layout-main">
		<div class="container">
			<h2>書籍管理システム</h2>
			<h3>メニュー</h3>
			<!-- メニュー項目 -->
			<div class="menu-buttons">
				<a th:href="@{/books/search}" class="menu-button">📚 書籍検索</a>
				<a th:href="@{/books/register}" class="menu-button">➕ 書籍登録</a>
				<a th:href="@{/books/delete}" class="menu-button">🗑 書籍削除</a>
			</div>
		</div>
	</main>
</body>

</html>
